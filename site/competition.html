<meta name="robots" content="noindex">
<title>CDA Donnerstags-Competition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: Kopfleiste mit fünf Ansichten (Turnierleitung, Board 1, Board 2, Live, Saison). Board-Ansicht = Anzeigetafel für einen PC mit Tastatur. */
:root{
  --bg:#0c110e; --panel:#131a15; --panel-2:#19221c; --line:#26312a;
  --ink:#eef2ec; --muted:#8f9c92; --green:#16a83b; --green-ink:#7be095; --red:#e3202d; --gold:#e6b43a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.tm{display:inline-block;font-family:var(--f-body);font-size:.62rem;font-weight:700;letter-spacing:.04em;line-height:1;padding:2px 4px;border-radius:3px;border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:900;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand span{font-size:.75rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:7px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
.demo-note{font-size:.78rem;color:var(--muted);padding-block:8px;border-bottom:1px solid var(--line)}
.demo-note b{color:var(--gold);font-weight:600}

main{padding-block:24px 56px}
h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.6rem;line-height:1;margin:0 0 12px;letter-spacing:.01em;text-wrap:balance}
h3{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.muted{color:var(--muted)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:6px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Check-in */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin-top:4px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);text-align:left;min-width:0}
.chip .box{width:18px;height:18px;border-radius:4px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:12px;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--green)}
.chip[aria-pressed="true"] .box{background:var(--green);border-color:var(--green);color:#fff}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{margin-left:auto;color:var(--gold);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;color:var(--ink);font:inherit}
.plan dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 16px}
.plan dt{color:var(--muted);font-size:.85rem}
.plan dd{margin:0;font-weight:600}
.big-n{font-family:var(--f-display);font-weight:900;font-size:3.4rem;line-height:.9}
.warn{border-left:3px solid var(--gold);padding:6px 10px;background:color-mix(in srgb,var(--gold) 10%,transparent);font-size:.88rem;margin:0 0 14px;border-radius:3px}

/* Tabellen */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
th:first-child,td:first-child{text-align:left;color:var(--muted);width:1%}
tr.q td:nth-child(2){font-weight:700}
tr.q td:first-child{color:var(--green-ink)}

/* Match-Listen */
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mitem{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:10px;align-items:center;padding:8px 10px;background:var(--panel-2);border-radius:var(--radius);font-size:.9rem}
.mitem .tag{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:72px}
.mitem .a{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .s{font-family:var(--f-display);font-weight:800;font-size:1.15rem;min-width:42px;text-align:center}
.mitem .w{font-weight:700}
.mitem.tbd{color:var(--muted)}

/* Boards in der Übersicht */
.bcard{display:grid;gap:8px}
.bcard .bhead{display:flex;justify-content:space-between;align-items:center}
.bcard .bname{font-family:var(--f-display);font-weight:800;font-size:1.2rem;text-transform:uppercase}
.pill{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted)}
.pill.live{background:color-mix(in srgb,var(--red) 22%,transparent);color:#ff8a92}
.pill.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px;animation:blink 1.4s infinite}
.pill.free{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green-ink)}
@keyframes blink{50%{opacity:.25}}
.mini{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;align-items:baseline}
.mini .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .n.on{font-weight:700}
.mini .n.on::before{content:"▸ ";color:var(--green-ink)}
.mini .av{font-size:.82rem;color:var(--muted)}
.mini .l{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--muted)}
.mini .r{font-family:var(--f-display);font-weight:800;font-size:1.6rem;min-width:56px;text-align:right}

.progress{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--green)}

/* Highlights */
.hl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hl li{display:flex;gap:10px;align-items:baseline;font-size:.9rem}
.hl b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--gold);min-width:54px}

/* Scorer */
.scorer{display:grid;gap:16px}
.sb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sb-head .stage{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wsmall{font-size:.85rem;color:var(--muted);margin-left:auto;margin-right:16px}
.call{display:grid;gap:20px;justify-items:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px 20px}
.call .stage{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.callh{font-size:1.2rem;color:var(--green-ink);margin:0}
.vs{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,6vw,4rem);line-height:1;text-transform:uppercase}
.vs i{font-family:var(--f-body);font-style:normal;font-size:1rem;color:var(--muted);text-transform:none;font-weight:500}
.vs .tm{font-size:.9rem;vertical-align:.6em}
.call .writer{width:100%;max-width:720px;justify-content:center}
.writer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--gold);color:#1a1405;border-radius:var(--radius);padding:10px 20px}
.writer .wl{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.writer .wn{font-family:var(--f-display);font-weight:900;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.writer .tm{color:#1a1405;border-color:rgba(26,20,5,.4);font-size:.9rem;vertical-align:.4em}
.writer.none{background:color-mix(in srgb,var(--red) 30%,var(--panel));color:var(--ink)}
.writer.none .wl{color:var(--ink)}
.sb-head .fmt{font-size:.85rem;color:var(--muted)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:grid;gap:6px;position:relative;min-width:0}
.side.on{border-color:var(--green);box-shadow:inset 0 4px 0 var(--green)}
.side .pn{font-weight:700;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:64px}
.side .legs{position:absolute;top:14px;right:18px;font-family:var(--f-display);font-weight:900;font-size:2.4rem;line-height:1}
.side .legs small{font-family:var(--f-body);font-size:.66rem;letter-spacing:.1em;color:var(--muted);font-weight:700;display:block;text-align:right}
.side .rest{font-family:var(--f-display);font-weight:900;font-size:clamp(4.5rem,13vw,9rem);line-height:.9;letter-spacing:-.01em}
.side.on .rest{color:#fff}
.side:not(.on) .rest{color:var(--muted)}
.side .co{min-height:1.6em;font-weight:700;color:var(--gold);letter-spacing:.04em}
.side .st{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.side .st b{color:var(--ink);font-weight:600}
.visits{display:flex;gap:6px;flex-wrap:wrap;min-height:28px}
.visits span{font-variant-numeric:tabular-nums;font-size:.85rem;background:var(--panel-2);border-radius:4px;padding:2px 7px;color:var(--muted)}
.visits span.hi{color:var(--gold);font-weight:700}
.visits span.bust{color:#ff8a92;text-decoration:line-through}

.entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:start}
.inbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:grid;gap:10px}
.inbox .who{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.inbox .val{font-family:var(--f-display);font-weight:900;font-size:4rem;line-height:1;min-height:1em;border-bottom:2px solid var(--green);padding-bottom:4px}
.inbox .val .cursor{display:inline-block;width:.08em;height:.8em;background:var(--green);vertical-align:-.05em;animation:blink 1s infinite}
.inbox .msg{min-height:1.5em;font-size:.9rem}
.inbox .msg.err{color:#ff8a92}
.keys{font-size:.8rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
kbd{font-family:var(--f-body);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink);background:var(--panel-2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 0;font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.pad button:hover{border-color:var(--muted)}
.pad button.ok{background:var(--green);border-color:var(--green);color:#fff;font-family:var(--f-body);font-size:1rem}
.pad button.rs{grid-column:span 2;background:var(--panel-2);border-color:var(--gold);color:var(--gold);font-family:var(--f-body);font-size:1rem;font-weight:700}
.pad button.fn{font-family:var(--f-body);font-size:.9rem;font-weight:600;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.quick button{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 0;font-weight:700;font-variant-numeric:tabular-nums}
.ask{background:color-mix(in srgb,var(--gold) 12%,var(--panel));border:1px solid var(--gold);border-radius:var(--radius);padding:16px 20px;display:grid;gap:12px}
.ask p{margin:0;font-weight:600}
.ask .row button{min-width:90px}
.over{background:color-mix(in srgb,var(--green) 14%,var(--panel));border:1px solid var(--green);border-radius:var(--radius);padding:20px;display:grid;gap:12px;text-align:center}
.over .res{font-family:var(--f-display);font-weight:900;font-size:2.6rem;line-height:1;text-transform:uppercase}
.idle{text-align:center;padding:48px 16px;display:grid;gap:10px;justify-items:center}
.idle .big-n{color:var(--muted)}

@media (max-width:760px){
  .entry{grid-template-columns:1fr}
  .duel{gap:8px}
  .side{padding:14px}
  .side .legs{font-size:1.8rem;top:10px;right:12px}
  .side .pn{padding-right:40px;font-size:1rem}
  .mitem{grid-template-columns:1fr auto 1fr}
  .mitem .tag{grid-column:1/-1;width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* Eingabe x01: Schnellwerte links und rechts, Ziffernblock in der Mitte */
.entry2{display:grid;grid-template-columns:minmax(0,320px) minmax(0,420px);gap:14px;align-items:stretch;justify-content:center}
.inbox2{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px;min-width:0}
.inbox2 .who{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.inbox2 .val{font-family:var(--f-display);font-weight:900;font-size:2.8rem;line-height:1;min-height:1em;border-bottom:2px solid var(--green);padding-bottom:2px;text-align:center}
.inbox2 .val .cursor{display:inline-block;width:.08em;height:.8em;background:var(--green);vertical-align:-.05em;animation:blink 1s infinite}
.inbox2 .msg{min-height:1.3em;font-size:.85rem;text-align:center}
.inbox2 .msg.err{color:#ff8a92}
.inbox2 .pad{gap:5px}
.inbox2 .pad button{padding:7px 0;font-size:1.3rem}
.inbox2 .pad button.ok,.inbox2 .pad button.rs,.inbox2 .pad button.fn{font-size:.92rem}
.quick2{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.quick2 button.q180{grid-column:1/-1}
.quick2 button{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,2.4vw,2rem);font-variant-numeric:tabular-nums;min-height:44px}
.quick2 button:hover{border-color:var(--muted);background:var(--panel-2)}
.quick2 button.q180{border-color:var(--gold);color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:.72rem;color:var(--muted);opacity:.75}
.legend kbd{font-size:.68rem}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.72rem}
.side{padding:20px 24px}
.side .legs{font-size:clamp(3rem,6vw,5rem)!important;top:16px!important;right:22px!important;text-align:center;line-height:.9}
.side .legs small{font-size:.8rem!important;text-align:center!important;margin-top:4px;letter-spacing:.14em}
.side .pn{padding-right:130px!important}
.side .pn{font-size:clamp(1.3rem,2.4vw,1.9rem)!important;padding-right:90px!important}
.side .st{font-size:clamp(1rem,1.6vw,1.25rem)!important;gap:8px 28px!important}
.side .st b{font-family:var(--f-display);font-weight:800;font-size:1.35em;margin-right:4px}
.side .visits span{font-size:1.05rem!important;padding:3px 9px!important}
.side .co{font-size:1.15rem}
.thrower{font-size:1rem}
.side .rest{font-size:clamp(5rem,16vw,13rem)!important}
.scorer{gap:12px}
@media (max-width:760px){.side .legs{font-size:2.4rem!important;top:10px!important;right:12px!important}.side .legs small{font-size:.6rem!important}.entry2{grid-template-columns:1fr}.inbox2{order:-1}.quick2{grid-template-columns:repeat(5,1fr)}.side .pn{padding-right:64px!important;font-size:1.05rem!important}.side .st{font-size:.85rem!important;gap:4px 12px!important}.quick2 button{font-size:1.15rem}.side .rest{font-size:clamp(3.6rem,17vw,6rem)!important}}
/* Modi */
.bysel{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;font:inherit;min-width:0;max-width:45%}
.recruit{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recruit li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel-2);border-radius:var(--radius);padding:10px 12px}
.recruit .rn{font-family:var(--f-display);font-weight:900;font-size:1.6rem;color:var(--gold);min-width:32px;text-align:center}
.recruit .gs{font-size:.8rem;color:var(--muted)}
.recruit .gv{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mode{display:grid;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);position:relative}
.mode b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-transform:uppercase;line-height:1}
.mode .ms{font-size:.78rem;color:var(--gold);font-weight:600}
.mode p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.4}
.mode[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.mode .flag{justify-self:start;margin-bottom:4px;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:99px}
.flag.ms-on{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green-ink)}
.flag.ms-off{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.hs{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;flex:none}
.modebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line)}
.modebar b{font-family:var(--f-display);font-weight:900;font-size:1.4rem;text-transform:uppercase;line-height:1}
.modebar span{color:var(--muted);font-size:.88rem}
.modebar .flag{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-left:auto}

/* Scorer-Zusätze */
.thrower{font-size:.85rem;color:var(--muted)}
.thrower b{color:var(--ink)}
.side.on .thrower b{color:var(--gold)}
.badge-di{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ff8a92;border:1px solid currentColor;border-radius:4px;padding:2px 6px}
.startval{font-size:.75rem;color:var(--muted)}

/* Cricket */
.cboard{display:grid;grid-template-columns:1fr auto 1fr;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.chead{padding:14px 18px;display:grid;gap:4px;min-width:0}
.chead.r{text-align:right}
.chead.on{box-shadow:inset 0 4px 0 var(--green)}
.chead .pn{font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .pts{font-family:var(--f-display);font-weight:900;font-size:clamp(3rem,8vw,5.5rem);line-height:.9}
.chead:not(.on) .pts{color:var(--muted)}
.chead .lg{font-size:.8rem;color:var(--muted)}
.cmid{display:grid;align-content:start;border-inline:1px solid var(--line)}
.crow{display:grid;grid-template-columns:64px 72px 64px;align-items:center;border-top:1px solid var(--line);height:46px}
.crow .no{font-family:var(--f-display);font-weight:900;font-size:1.6rem;text-align:center}
.crow.closed .no{color:var(--muted);text-decoration:line-through}
.mk{display:grid;place-items:center}
.mk svg{width:30px;height:30px}
.crow .mk.done svg{color:var(--green-ink)}
.ctop{height:auto;padding:8px 0;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cpad .no{font-family:var(--f-display);font-weight:900;font-size:1.3rem;display:grid;place-items:center;color:var(--muted)}
.cpad button{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 0;font-weight:700}
.cpad button:hover{border-color:var(--muted)}
.cpad button.t{color:var(--gold)}
.cpad button:disabled{opacity:.3;cursor:not-allowed}
.cvis{display:flex;gap:8px;min-height:44px;align-items:center;flex-wrap:wrap}
.cvis span{font-family:var(--f-display);font-weight:800;font-size:1.5rem;background:var(--panel-2);border-radius:4px;padding:2px 12px;min-width:64px;text-align:center}
.cvis span.empty{color:var(--line);font-family:var(--f-body);font-size:1rem}

/* Saison */
.rank td:nth-child(2){font-weight:600}
.cut td{border-bottom:2px dashed var(--gold)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:.6rem;font-weight:700;background:var(--panel-2);color:var(--muted)}
.form i.f1{background:var(--gold);color:#1a1405}
.form i.f4{background:color-mix(in srgb,var(--green) 45%,transparent);color:#fff}
.form i.f0{background:none;border:1px dashed var(--line)}
.pts{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rec{background:var(--panel-2);border-radius:var(--radius);padding:12px 14px;display:grid;gap:2px;min-width:0}
.rec .rv{font-family:var(--f-display);font-weight:900;font-size:2.2rem;line-height:1;color:var(--gold)}
.rec .rl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rec .rw{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.evc{background:var(--panel-2);border-radius:var(--radius);padding:12px 14px;display:grid;gap:4px;border-left:3px solid var(--line);min-width:0}
.evc.ms{border-left-color:var(--green)}
.evc.sp{border-left-color:var(--gold)}
.evc .ed{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.evc .en{font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-transform:uppercase;line-height:1.05}
.evc .ew{font-size:.9rem}
.evc .ew b{color:var(--gold)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sorted{color:var(--green-ink)}
.duel-pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.duel-pick select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font:inherit;min-width:0;max-width:100%}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:16px;text-align:center}
.h2h .hn{font-weight:700;overflow-wrap:anywhere}
.h2h .hs2{font-family:var(--f-display);font-weight:900;font-size:3.4rem;line-height:1}
.h2h .hd{font-size:.82rem;color:var(--muted)}
.bars{display:grid;gap:6px;margin-top:14px}
.bar{display:grid;grid-template-columns:1fr 90px 1fr;gap:10px;align-items:center;font-size:.85rem}
.bar .l,.bar .r{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;display:flex}
.bar .l{justify-content:flex-end}
.bar .l i{background:var(--green)}
.bar .r i{background:var(--gold)}
.bar .c{text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.bar .v{display:flex;justify-content:space-between;grid-column:1/-1;font-variant-numeric:tabular-nums;margin-top:-4px;font-size:.82rem}
@media (max-width:760px){
  .crow{grid-template-columns:44px 52px 44px;height:40px}
  .crow .no{font-size:1.3rem}
  .mk svg{width:24px;height:24px}
  .chead{padding:10px 12px}
}
.gev.gnone{cursor:default}
.sync{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.sync.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green-ink)}
.sync.busy{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.sync.err{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red);white-space:normal}
.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.sbp .sbgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
@media (max-width:760px){.sbp .sbgrid{grid-template-columns:1fr}}
.sblist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sblist li{background:var(--panel-2);border-radius:99px;padding:4px 10px;font-size:.88rem}
.wa h3{margin:0 0 8px}
.watxt{white-space:pre-wrap;font:inherit;font-size:.9rem;background:var(--panel-2);border-left:3px solid #25D366;border-radius:var(--radius);padding:12px;margin:0 0 10px}
.legbox{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;display:grid;gap:10px;margin-bottom:14px}
.legbox h3{margin:0}
.legseg{display:flex;flex-wrap:wrap;gap:6px}
.legseg .btn.on{background:var(--green);border-color:var(--green);color:#fff}
.legt{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.legt select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px}
.legrows{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.legrows li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border-radius:var(--radius);padding:6px 6px 6px 12px;border-left:3px solid var(--line)}
.legrows li.cut{border-left-color:var(--gold)}
.legrows li.cut b{color:var(--gold)}
.lsw{display:inline-flex;align-items:center;gap:6px}
.lsw b{min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.lsw button{width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:1.05rem;color:var(--ink)}
.lsw button:disabled{opacity:.35;cursor:default}
.warn-t{color:var(--red);font-weight:600}
.lbh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lb{position:relative}
.inf summary{list-style:none;cursor:pointer;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:700 .72rem/17px var(--f-body);text-align:center;font-style:italic;user-select:none}
.inf summary::-webkit-details-marker{display:none}
.inf summary:hover,.inf[open] summary{border-color:var(--green);color:var(--green-ink)}
.inf p{position:absolute;left:8px;right:8px;top:38px;z-index:3;margin:0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--radius);padding:10px 12px;font-size:.84rem;line-height:1.45;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.rank2 td{vertical-align:middle;padding-block:8px}
.rank2 .rk{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;font-weight:700;font-variant-numeric:tabular-nums}
.rank2 tr.t1 .rk{background:var(--gold);color:#1a1300}
.rank2 tr.t2 .rk{background:#b8c0ba;color:#141a16}
.rank2 tr.t3 .rk{background:#b07a4a;color:#fff}
.rank2 tr.t1 td,.rank2 tr.t2 td,.rank2 tr.t3 td{background:color-mix(in srgb,var(--gold) 7%,transparent)}
.rank2 tr.t1 td:nth-child(2){font-size:1.05rem}
.ptc{display:inline-grid;gap:4px;justify-items:end;min-width:110px}
.ptc b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1}
.pb{display:block;width:110px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;background:var(--green);border-radius:99px}
.abc{display:inline-flex;align-items:center;gap:8px}
.abc b{min-width:18px;font-variant-numeric:tabular-nums}
.pips{display:inline-grid;grid-template-columns:repeat(16,5px);gap:2px}
.pips i{height:12px;border-radius:1px;background:var(--line)}
.pips i.on{background:var(--green)}
.pips i.need{background:transparent;box-shadow:inset 0 0 0 1px var(--gold)}
.qchip.out{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.rank2 td.mon{color:var(--gold);font-weight:600}
.rank2 tr.cutrow td{padding:0;border-bottom:0;text-align:center;color:var(--red)}
.rank2 tr.cutrow span{display:block;border-top:2px dashed var(--red);padding:4px 0 6px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
/* ===== Spielbetrieb: Auswahl, Anmeldung, Zuschauer ===== */
.demo-note a{color:var(--green-ink);font-weight:600}
.gate{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start;padding-top:8px}
.gcard h3{margin-bottom:12px}
.gev{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;width:100%;padding:18px;border-radius:var(--radius);background:var(--panel-2);border:1px solid var(--line);transition:border-color .15s}
.gev:hover,.gev:focus-visible{border-color:var(--green)}
.gev b{font-family:var(--f-display);font-weight:900;font-size:2.2rem;line-height:1;text-transform:uppercase}
.gev .muted{font-size:.88rem}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gopen{font-weight:700;color:var(--green-ink);margin-top:4px}
.gev .progress{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.gev .progress i{display:block;height:100%;background:var(--green)}
.gst{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gst.live{color:var(--red)}
.gst.live i{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.gnext{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.gnext li{display:grid;grid-template-columns:96px 1fr;gap:2px 10px;align-items:baseline;padding:8px 10px;border-radius:var(--radius);background:var(--panel-2);border-left:3px solid var(--line)}
.gnext li.ms{border-left-color:var(--gold)}
.gnext li span{font-size:.85rem;color:var(--muted)}
.gnext li i{grid-column:2;font-style:normal;font-size:.78rem;color:var(--gold)}
.glog{display:grid;gap:8px}
.glog label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.glog select,.glog input{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;width:100%;min-width:0}
.glog .btn{margin-top:6px;justify-self:start}
.gerr{margin:0;color:var(--red);font-weight:600;font-size:.9rem}
.cap.demo{border-left:3px solid var(--gold);padding-left:10px}
.mebox{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--radius);padding:10px 14px}
.mebox select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;max-width:100%}
.mebox .mnow{color:var(--green-ink)}
.mebox .mwr{color:var(--gold)}
/* ===== Neu: Einstellungen, Siegerehrung, Profil, Recap, Saison ===== */
.setup{display:grid;gap:12px}
.vpre{display:flex;gap:8px;flex-wrap:wrap}
.vpre button{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-weight:600;text-align:left;display:grid;gap:2px}
.vpre button small{font-size:.74rem;color:var(--muted);font-weight:500}
.vpre button[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.bcount{display:flex;align-items:center;gap:10px}
.bcount button{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel-2);font-weight:800;font-size:1.2rem}
.bcount b{font-family:var(--f-display);font-weight:900;font-size:2rem;min-width:28px;text-align:center}
.btypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.btypes button{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.88rem}
.btypes button span{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.btypes .t-pc{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green-ink)}
.btypes .t-tablet{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.money div{background:var(--panel-2);border-radius:var(--radius);padding:8px 10px}
.money b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.5rem;line-height:1;color:var(--gold)}
.money span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.devtag{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-left:8px;vertical-align:2px}
.selall{display:flex;gap:6px;margin:-4px 0 8px}

/* Tablet-Scorer */
.scorer.tablet .legend{display:none}
.scorer.tablet .entry2{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);max-width:900px;margin:0 auto;width:100%}
.scorer.tablet .inbox2 .pad button{padding:16px 0;font-size:1.9rem}
.scorer.tablet .inbox2 .pad button.ok,.scorer.tablet .inbox2 .pad button.rs,.scorer.tablet .inbox2 .pad button.fn{font-size:1.1rem}
.scorer.tablet .quick2 button{font-size:2rem}

/* Siegerehrung */
.cer{display:grid;gap:22px;justify-items:center;text-align:center;padding:36px 20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.cer .ct{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green-ink);font-weight:700}
.cer h2{font-size:clamp(2.4rem,6vw,4rem);font-weight:900;margin:0}
.podium3{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;width:100%;max-width:900px}
.pod{border-radius:var(--radius) var(--radius) 0 0;padding:16px 10px;display:grid;gap:6px;justify-items:center;min-width:0}
.pod .pl{font-family:var(--f-display);font-weight:900;font-size:3rem;line-height:1}
.pod .pnm{font-weight:700;font-size:clamp(1rem,2vw,1.35rem);overflow-wrap:anywhere}
.pod .pm{font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,3.4vw,2.4rem);color:var(--gold);line-height:1}
.pod.p1{background:color-mix(in srgb,var(--gold) 22%,var(--panel-2));min-height:240px;border-top:4px solid var(--gold)}
.pod.p2{background:var(--panel-2);min-height:190px;border-top:4px solid var(--muted)}
.pod.p3{background:var(--panel-2);min-height:160px;border-top:4px solid #b07a4a}
.rest6{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%;max-width:640px}
.rest6 li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:var(--radius);padding:8px 12px;text-align:left}
.rest6 b{font-family:var(--f-display);font-weight:900;font-size:1.4rem}
.rest6 .pm{font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:1.2rem}

/* Recap */
.recap{aspect-ratio:4/5;max-width:400px;width:100%;background:#0b100c;color:#eef2ec;border-radius:10px;padding:22px;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:12px;position:relative;overflow:hidden;border:1px solid var(--line);justify-self:center}
.recap::after{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(43,198,83,.25);box-shadow:0 0 0 30px rgba(227,2,18,.08),0 0 0 60px rgba(43,198,83,.06);pointer-events:none}
.recap .rt{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#7be095;font-weight:700;position:relative;z-index:1}
.recap .rw{font-family:var(--f-display);font-weight:900;font-size:2.3rem;line-height:.92;text-transform:uppercase;position:relative;z-index:1}
.recap .rw small{display:block;line-height:1.3;font-size:.86rem;font-family:var(--f-body);font-weight:600;color:#9fb0a3;letter-spacing:.02em;margin-top:6px;text-transform:none}
.recap .tm{color:#9fb0a3;border-color:#26332a}
.rleg{display:grid;gap:4px}
.rleg .lh{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:#9fb0a3;font-weight:700}
.rleg .lv{display:flex;gap:5px;flex-wrap:wrap}
.rleg .lv span{font-family:var(--f-display);font-weight:800;font-size:1.15rem;background:rgba(255,255,255,.08);border-radius:4px;padding:2px 8px}
.rleg .lv span.co{background:#2BC653;color:#06120a}
.rpod{list-style:none;margin:0;padding:0;display:grid;gap:5px;align-self:center}
.rpod li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;font-weight:600;font-size:.9rem;gap:6px}
.rpod b{font-family:var(--f-display);font-weight:900;font-size:1.2rem;color:#E6B43A}
.rpod span.r{font-size:.8rem;color:#9fb0a3;font-variant-numeric:tabular-nums}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #26332a;padding-top:10px}
.rstats b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1;color:#E6B43A}
.rstats span{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#9fb0a3;font-weight:700}

/* Saison */
.sbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sbar select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font:inherit;font-weight:600}
.pot{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center}
.pot .pv{font-family:var(--f-display);font-weight:900;font-size:clamp(3rem,7vw,4.6rem);line-height:.9;color:var(--gold)}
.pot .pd{font-size:.9rem;color:var(--muted)}
.pot .pd b{color:var(--ink)}
.pbar{grid-column:1/-1;height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold)}
.split{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.split span{background:var(--panel-2);border-radius:99px;padding:4px 10px;font-size:.8rem;font-variant-numeric:tabular-nums}
.split span b{color:var(--gold)}
.qchip{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.qchip.ok{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green-ink)}
.qchip.no{background:var(--panel-2);color:var(--muted)}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.sched div{background:var(--panel-2);border-radius:var(--radius);padding:8px 10px;display:grid;gap:2px;border-top:3px solid var(--line)}
.sched div.ms{border-top-color:var(--green)}
.sched div.sp{border-top-color:var(--gold)}

function bracketOrder(K){var o=[1];while(o.length<K){var n=o.length*2,x=[];o.forEach(function(s){x.push(s,n+1-s);});o=x;}return o;}

/* --- x01 --- */

/* ================= Platzierungen und Geld ================= */
function placements(ev){
  if(ev.phase!=='done')return null;
  var md=MD(ev),out={},n=Object.keys(ev.parts).length;
  function set(part,place){if(part&&!out[part])out[part]={place:place};}
  function st(name){return ev.matches.filter(function(m){return m.stage===name;});}
  var f=st('Finale')[0];set(winnerPart(f),1);set(loserPart(f),2);
  var p3=st('Spiel um Platz 3')[0];if(p3){set(winnerPart(p3),3);set(loserPart(p3),4);}
  var p5=st('Spiel um Platz 5')[0];if(p5){set(winnerPart(p5),5);set(loserPart(p5),6);}
  st('Platz 5–8').forEach(function(m){set(loserPart(m),7);});
  var place=Object.keys(out).length+1;
  ['Viertelfinale','Achtelfinale','Sechzehntelfinale'].forEach(function(s){var l=st(s).map(loserPart).filter(function(p){return !out[p];});l.forEach(function(p){set(p,place);});place+=l.length;});

  var prize=md.masters?payout(n*DAY_FEE,DAY_SPLIT):md.finals?payout(potFor(ev.season),FIN_SPLIT):[];
  var wins={};ev.matches.forEach(function(m){if(m.status==='done'){var w=winnerPart(m);wins[w]=(wins[w]||0)+1;}});
  Object.keys(out).forEach(function(k){var o=out[k],behind=Object.keys(out).filter(function(j){return out[j].place>o.place;}).length;
    o.pts=md.masters?PTS_START+PTS_BEHIND*behind+PTS_WIN*(wins[k]||0)+(PTS_BONUS[o.place]||0):0;o.money=prize[o.place-1]||0;});
  return out;
}
function podium(ev){var pc=placements(ev);if(!pc)return[];return Object.keys(pc).map(function(k){return{part:+k,place:pc[k].place,money:pc[k].money,pts:pc[k].pts};}).sort(function(a,b){return a.place-b.place;});}
function potFor(season){return sum(ARCHIVE.filter(function(e){return e.season===season&&MODES[e.mode].masters;}).map(function(e){return e.pids.length*POT_FEE;}));}

/* ================= Statistik ================= */
function blank(){return{ev:0,sp:0,w:0,sc:0,dt:0,t180:0,t171:0,hf:0,best:0,sl:0,mk:0,cd:0,m9:0};}
function stats(evs){
  var o={};function X(pid){return o[pid]||(o[pid]=blank());}
  evs.forEach(function(ev){
    var cr=MD(ev).kind==='cricket';ev.pids.forEach(function(p){X(p).ev++;});
    ev.matches.forEach(function(m){
      if(!m.a||!m.b)return;
      var single=ev.parts[m.a].members.length===1&&ev.parts[m.b].members.length===1,full=ev.parts[m.a].start===501&&ev.parts[m.b].start===501;
      if(m.status==='done')[0,1].forEach(function(s){ev.parts[s===0?m.a:m.b].members.forEach(function(p){var x=X(p);x.sp++;if(m.winner===s)x.w++;});});
      m.legs.forEach(function(l){var ld=[0,0];l.visits.forEach(function(v){
        var x=X(v.who);ld[v.p]+=v.darts;
        if(cr){x.mk+=v.marks;x.cd+=v.darts;if(v.marks===9)x.m9++;return;}
        x.dt+=v.darts;if(!v.bust){x.sc+=v.score;if(v.score===180)x.t180++;else if(v.score>=171)x.t171++;}
        if(v.co){if(v.score>x.hf)x.hf=v.score;if(single&&full){if(ld[v.p]<=18)x.sl++;if(!x.best||ld[v.p]<x.best)x.best=ld[v.p];}}
      });});
    });
  });
  return o;
}
function avgOf(x){return x&&x.dt?x.sc/x.dt*3:0;}
function mprOf(x){return x&&x.cd?x.mk/x.cd*3:0;}
function sideQ(ev,m,s){var sc=0,dt=0,mk=0;m.legs.forEach(function(l){l.visits.forEach(function(v){if(v.p!==s)return;dt+=v.darts;if(!v.bust)sc+=v.score||0;mk+=v.marks||0;});});
  if(!dt)return '–';return MD(ev).kind==='cricket'?(mk/dt*3).toFixed(2).replace('.',',')+' MPR':'Ø '+(sc/dt*3).toFixed(2).replace('.',',');}

/* Tiefe Statistik pro Spieler: nur Einzel, 501 */
var BUCK=[[0,39,'unter 40'],[40,59,'40–59'],[60,99,'60–99'],[100,139,'100+'],[140,179,'140+'],[180,180,'180']];
var LEGB=[[0,15,'bis 15'],[16,18,'16–18'],[19,21,'19–21'],[22,24,'22–24'],[25,27,'25–27'],[28,30,'28–30'],[31,99,'31+']];
function deep(evs){
  var o={};function X(p){return o[p]||(o[p]={hs:0,hw:0,bs:0,bw:0,dec:0,decw:0,cb:0,cbn:0,bk:[0,0,0,0,0,0],legs:[0,0,0,0,0,0,0],f9s:0,f9d:0,vals:[],fv:0,fc:0,form:[]});}
  evs.forEach(function(ev,ei){
    var per={};
    ev.matches.forEach(function(m){
      if(m.status!=='done'||!m.a||!m.b)return;var A=ev.parts[m.a],B=ev.parts[m.b];
      if(A.members.length!==1||B.members.length!==1||A.start!==501||B.start!==501||MD(ev).kind!=='x01')return;
      var ids=[A.members[0],B.members[0]],won=[0,0];
      m.legs.forEach(function(l,li){
        if(l.winner==null)return;
        [0,1].forEach(function(s){var x=X(ids[s]);
          if(l.starter===s){x.hs++;if(l.winner===s)x.hw++;}else{x.bs++;if(l.winner===s)x.bw++;}
          if(won[0]===m.ft-1&&won[1]===m.ft-1){x.dec++;if(l.winner===s)x.decw++;}
        });
        var rest=[501,501],cnt=[0,0],dts=[0,0];
        l.visits.forEach(function(v){var x=X(ids[v.p]);cnt[v.p]++;dts[v.p]+=v.darts;
          var sc=v.bust?0:v.score;for(var k=0;k<BUCK.length;k++)if(sc>=BUCK[k][0]&&sc<=BUCK[k][1]){x.bk[k]++;break;}
          x.vals.push(sc);if(cnt[v.p]<=3){x.f9s+=sc;x.f9d+=v.darts;}
          if(rest[v.p]<=40)x.fv++;if(v.co)x.fc++;
          if(!v.bust)rest[v.p]-=v.score;

/* --- Recap --- */
function recap(ev){
  var md=MD(ev),pd=podium(ev),n=Object.keys(ev.parts).length,best=null;
  ev.matches.forEach(function(m){if(!m.a||!m.b)return;var A=ev.parts[m.a],B=ev.parts[m.b];if(A.members.length!==1||B.members.length!==1||A.start!==501)return;
    m.legs.forEach(function(l){if(l.winner==null)return;var vs=l.visits.filter(function(v){return v.p===l.winner;}),d=sum(vs.map(function(v){return v.darts;}));
      if(!best||d<best.d)best={d:d,who:vs[0].who,vs:vs};});});
  var st=stats([ev]),n180=sum(Object.keys(st).map(function(k){return st[k].t180;})),hf=0,hfw=null,ba=0,baw=null;
  Object.keys(st).forEach(function(k){if(st[k].hf>hf){hf=st[k].hf;hfw=+k;}var a=avgOf(st[k]);if(st[k].dt>=45&&a>ba){ba=a;baw=+k;}});
  var fin=ev.matches.filter(function(m){return m.stage==='Finale';})[0],w=pd[0];
  return '<div class="recap"><span class="rt">'+md.name+' · '+wdS(ev.date)+' '+dshort(ev.date)+' · '+ev.pids.length+' Spieler</span>'+
    '<span class="rw">'+partN(ev,w.part)+'<small>gewinnt das Finale '+legsWon(fin,fin.winner)+':'+legsWon(fin,1-fin.winner)+' gegen '+esc(partN(ev,loserPart(fin)))+(w.money?' · '+eur(w.money):'')+'</small></span>'+
    (best&&md.kind==='x01'?'<div class="rleg"><span class="lh">Leg des Abends · '+esc(pn(best.who))+' · '+best.d+' Darts</span><div class="lv">'+best.vs.map(function(v){return '<span class="'+(v.co?'co':'')+'">'+v.score+'</span>';}).join('')+'</div></div>':'<div></div>')+
    '<ol class="rpod">'+pd.slice(0,md.finals?6:4).map(function(x){return '<li><b>'+x.place+'</b><span>'+esc(partN(ev,x.part))+'</span><span class="r">'+(x.money?eur(x.money):'')+'</span></li>';}).join('')+'</ol>'+
    '<div class="rstats"><div><b class="num">'+(md.kind==='x01'?n180:'–')+'</b><span>180er</span></div><div><b class="num">'+(hf||'–')+'</b><span>High Finish'+(hfw?' · '+esc(pn(hfw).split(' ')[0]):'')+'</span></div><div><b class="num">'+(ba?fmt1(ba):'–')+'</b><span>Bester Avg'+(baw?' · '+esc(pn(baw).split(' ')[0]):'')+'</span></div></div></div>'+
    '<p class="cap" style="text-align:center">Im echten System als Bild zum Herunterladen für Instagram.</p>';
}

/* --- Live --- */
function hlList(ev){
  var agg={},out=[];ev.hl.forEach(function(h){var k=h.who+'|'+h.t;if(agg[k]){agg[k].n++;return;}agg[k]={t:h.t,who:h.who,leg:h.leg,big:h.big,n:1};out.push(agg[k]);});
  out=out.slice(0,10);
  return out.length?'<ul class="hl">'+out.map(function(h){return '<li><b class="num">'+(h.n>1?h.n+'× ':'')+h.t+'</b><span>'+pnh(h.who)+(h.leg?' · Short Leg':h.big?' · High Finish':'')+'</span></li>';}).join('')+'</ul>':'<p class="muted" style="margin:0">Noch keine Highlights.</p>';
}
function statTable(evs,cricket){
  var st=stats(evs),ids=Object.keys(st).map(Number).filter(function(id){return cricket?st[id].cd:st[id].dt;});
  ids.sort(function(a,b){return cricket?mprOf(st[b])-mprOf(st[a]):avgOf(st[b])-avgOf(st[a]);});
  if(cricket)return '<table><thead><tr><th>#</th><th>Spieler</th><th>MPR</th><th>Marks</th><th>9-Marker</th><th>Siege</th></tr></thead><tbody>'+ids.map(function(id,i){var x=st[id];return '<tr><td>'+(i+1)+'</td><td>'+plink(id)+'</td><td>'+fmt2(mprOf(x))+'</td><td>'+x.mk+'</td><td>'+(x.m9||'–')+'</td><td>'+x.w+'/'+x.sp+'</td></tr>';}).join('')+'</tbody></table>';
  return '<table><thead><tr><th>#</th><th>Spieler</th><th>Avg</th><th>180</th><th>171+</th><th>Short Legs</th><th>High Finish</th><th>Bestes Leg</th></tr></thead><tbody>'+ids.map(function(id,i){var x=st[id];return '<tr><td>'+(i+1)+'</td><td>'+plink(id)+'</td><td>'+fmt2(avgOf(x))+'</td><td>'+(x.t180||'–')+'</td><td>'+(x.t171||'–')+'</td><td>'+(x.sl||'–')+'</td><td>'+(x.hf||'–')+'</td><td>'+(x.best?x.best+' Darts':'–')+'</td></tr>';}).join('')+'</tbody></table>';
}

/* --- Saison --- */
function seasonEvs(){return S.season==='all'?ARCHIVE.slice():ARCHIVE.filter(function(e){return e.season===S.season;});}
function seasons(){var o={};o[CUR_SEASON]=1;ARCHIVE.forEach(function(e){o[e.season]=1;});return Object.keys(o).sort().reverse();}

function seasonSelect(){return '<div class="sbar"><label for="ssel" class="muted">Saison</label><select id="ssel" data-season="1">'+seasons().map(function(s){return '<option value="'+s+'"'+(S.season===s?' selected':'')+'>'+seasonLabel(s)+'</option>';}).join('')+'<option value="all"'+(S.season==='all'?' selected':'')+'>Alle Saisons (ewig)</option></select>'+(SITE?'':'<span class="muted" style="font-size:.82rem">„Simulation 2026“ ist eine komplett ausgedachte Saison zum Anschauen. 2027 ist die echte Saison, sie beginnt am 07.01.2027.</span>')+'</div>';}
var LBINFO={'CDA-Rating':'Wertung nach dem Elo-Prinzip: Jeder startet mit 1.500. Wer gewinnt, bekommt Punkte vom Gegner, gegen Stärkere mehr als gegen Schwächere. Zeigt die aktuelle Spielstärke, unabhängig davon, wie oft jemand da war.','Average (501)':'Durchschnittliche Punkte pro Aufnahme (3 Darts) in allen 501-Spielen der Saison. Gewertet ab 90 geworfenen Darts.','Hold-Quote':'Anteil der Legs, die ein Spieler gewinnt, wenn er selbst anwirft. Wer den eigenen Anwurf sicher durchbringt, hat eine hohe Hold-Quote.','Break-Quote':'Anteil der Legs, die ein Spieler gewinnt, obwohl der Gegner anwirft. Eine hohe Break-Quote heißt: Er holt auch Legs, in denen er hinten liegt.','Clutch: Decider gewonnen':'Der Decider ist das entscheidende Leg bei 1:1 (Best of 3) oder 2:2 (Best of 5). Gezeigt wird, wie viele davon jemand gewinnt. Gewertet ab 3 Decidern.','180er':'Anzahl der geworfenen 180er in der Saison, in allen Spielmodi.'};
function lbCard(title,ids,val,fmt){var inf=LBINFO[title];return '<div class="lb"><div class="lbh"><h4>'+title+'</h4>'+(inf?'<details class="inf"><summary aria-label="Was bedeutet '+title+'?" title="Was bedeutet das?">i</summary><p>'+inf+'</p></details>':'')+'</div><ol>'+ids.slice(0,5).map(function(id,i){return '<li><i>'+(i+1)+'</i><span>'+plink(id)+'</span><b>'+fmt(val(id))+'</b></li>';}).join('')+'</ol></div>';}
function viewSeason(){
  var evs=seasonEvs(),ms=evs.filter(function(e){return MODES[e.mode].masters;});

  var top=rk.length?rk[0].pts:1,qn=0,cut=-1,lastQ=-1;

  var full=cut>=0;if(!full)cut=lastQ;var inF={};qn=0;rk.forEach(function(r){if(r.n>=MIN_QUALI&&!pl(r.pid).guest&&++qn<=MAX_FINALS)inF[r.pid]=1;});

      :g?'<span class="qchip no">Gast</span>':inF[r.pid]?'<span class="qchip ok">✓ Finals</span>':r.n>=MIN_QUALI?'<span class="qchip out">über Platz 32</span>':'<span class="qchip no">noch '+(MIN_QUALI-r.n)+' Abend'+(MIN_QUALI-r.n>1?'e':'')+'</span>';

    '<div class="split">'+FIN_SPLIT.map(function(p,i){return '<span>'+(i+1)+'. Platz <b>'+Math.round(p*100)+' %</b> · aktuell '+eur(fp[i])+'</span>';}).join('')+'</div></div>';

  var sched='',up=cal(CUR_SEASON).filter(function(x){return x.date>=TONIGHT;}).slice(0,12);

    lbCard('180er',Object.keys(sa).map(Number).filter(function(id){return sa[id].t180;}).sort(function(a,b){return sa[b].t180-sa[a].t180;}),function(id){return sa[id].t180;},String);

/* --- Spielerprofil --- */
var NS='http://www.w3.org/2000/svg';

function radar(ax){
  var cx=150,cy=140,R=90,n=ax.length,s='';function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];}

  else if(a==='commit'){commit(ev,b);S.msg[b]='';}

  else if(a==='cd'){var gm2=byId(ev,ev.boards[b]);if(gm2)gm2.started=true;S.msg[b]=cDart(ev,b,+t.getAttribute('data-n'),+t.getAttribute('data-m'));}
  else if(a==='cend'){S.msg[b]=cEnd(ev,b,false);}
  else if(a==='sort'){var k=t.getAttribute('data-k');if(S.sort.k===k)S.sort.d*=-1;else S.sort={k:k,d:k==='name'||k==='best'?1:-1};}
  else if(a==='prof'){if(S.view!=='profile')S.back=S.view;S.pid=+t.getAttribute('data-id');S.view='profile';render();top();return 'stop';}
  else if(a==='back'){S.view=S.back||'season';render();top();return 'stop';}
  else if(a==='watch'){S.role='spec';S.view='s-live';if(LIVEAUTH&&SV.gate){S.live=true;SV.date=SV.gate.date;S.ev=SV.gate.state;ensurePlayers(S.ev);SV.rev=SV.gate.rev;}render();top();return 'stop';}
  else if(a==='showall'){S.showAll=!S.showAll;}
}

LT.addEventListener('change',function(e){if(!e.target.getAttribute)return;if(e.target.getAttribute('data-season')){S.season=e.target.value;render();}else if(e.target.getAttribute('data-me')){S.me=+e.target.value||null;render();}else if(e.target.getAttribute('data-legtarget')){S.legs.target=e.target.value.replace(' Uhr','');render();}else if(e.target.getAttribute('data-legfh')){S.legs.fh=+e.target.value;render();}});
LT.addEventListener('submit',function(e){
  if(e.target.id==='loginform'){e.preventDefault();var code=DOC.getElementById('lg-code').value,role=DOC.getElementById('lg-role').value;
    if(!LIVEAUTH){if(code.trim().toLowerCase()!=='cda'){S.login={err:'Code stimmt nicht.'};render();return;}S.login={};S.role=role;S.view=role;render();top();return;}
    var btn=e.target.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Anmelden …';}
    authLogin(role,code).then(function(){S.login={};S.role=role;S.view=role;return enterLive();}).then(function(){render();top();})
      .catch(function(x){S.login={err:x.message};render();});
    return;}
  if(e.target.id!=='addform')return;e.preventDefault();
  var v=DOC.getElementById('guest').value.trim();if(!v)return;
  var by=+DOC.getElementById('guestby').value||null,p=S.live?liveGuest(v,by):P(v+' (Gast)',45,'',1,.3,by);S.checked[p.id]=true;if(by)S.checked[by]=true;render();
});
if(!SITE)document.addEventListener('keydown',function(e){
  if(!/^b\d+$/.test(S.view))return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'))return;
  var b=+S.view.slice(1),k=e.key,cr=MD(S.ev).kind==='cricket';
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();liveRun(b,function(){S.msg[b]=undo(S.ev,b);});render();return;}
  if(!cr&&(k==='r'||k==='R')){e.preventDefault();liveRun(b,function(){key(b,'Rest');});render();return;}
  if(cr&&/^[tdsTDS]$/.test(k)){e.preventDefault();liveRun(b,function(){key(b,k);});render();return;}
  if(/^\d$/.test(k)||k==='Enter'||k==='Backspace'||k==='Escape'){e.preventDefault();liveRun(b,function(){key(b,k);});render();}
});
if(!SITE){try{var ss=JSON.parse(sessionStorage.getItem('cda-sb')||'null');if(ss&&ss.role&&(ss.role==='spec'||!LIVEAUTH)){S.role=ss.role;S.view=ss.view;S.me=ss.me||null;}}catch(e){}
  if(LIVEAUTH&&AUTH&&AUTH.role){S.role=AUTH.role;S.view=(ss&&ss.role===AUTH.role&&ss.view)||AUTH.role;authRefresh();enterLive();}
  else if(LIVEAUTH&&S.role==='spec'){S.role=null;S.view='gate';}
  if(/#live/.test(location.hash)){S.role=S.role||'spec';if(!/^s-/.test(S.view))S.view='s-live';}
  /* Simulation: im Zuschauermodus läuft der Abend von selbst weiter */
  setInterval(function(){
    if(S.role!=='spec'||!/^s-/.test(S.view)||document.hidden)return;var ev=S.ev;if(ev.phase!=='running')return;
    var act=[];ev.boards.forEach(function(id,b){if(id)act.push(b);});if(!act.length){fill(ev);render();return;}
    var b=act[Math.floor(Math.random()*act.length)],m=byId(ev,ev.boards[b]);
    if(m.over)commit(ev,b);else{simVisit(ev,b);if(m.over)commit(ev,b);}
    if(DOC.activeElement&&DOC.activeElement.tagName==='SELECT')return;render();
  },1800);
}
if(location.protocol==='file:')window.__CDA_TEST=function(){return {S:S,ARCHIVE:ARCHIVE,pl:pl};};
loadRealSeasons();
render();
})();
</script>
