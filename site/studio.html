<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>CDA Grafik-Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700;800;900&family=Anton&family=Permanent+Marker&family=Rubik+Mono+One&family=Alfa+Slab+One&family=Playfair+Display:wght@700;900&display=swap">
<style>
:root{--red:#E30212;--green:#0CA12D;--bg:#0d100e;--panel:#161a18;--line:#2a302d;--fg:#f2f2ee;--mute:#9aa39e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Archivo,Arial,sans-serif}
header.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
header.top img{height:40px}
header.top h1{font:900 26px/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
header.top h1 span{color:var(--green)}
header.top a{margin-left:auto;color:var(--mute);font-size:13px}
.app{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px;padding:16px;max-width:1240px;margin:0 auto}
@media(max-width:820px){.app{grid-template-columns:1fr}.view{order:-1}}
.ctl{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.box h2{font:800 15px/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;background:#202623;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:600 13px Archivo,Arial,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.themes button{background:#202623;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font:600 12px Archivo,Arial,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.themes button i{display:block;width:100%;height:16px;border-radius:4px}
.themes button[aria-pressed=true]{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
label.f{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0f1311;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px Archivo,Arial,sans-serif}
textarea{resize:vertical;min-height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.chk input{width:auto}
.view{display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{width:100%;max-width:460px}
canvas{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 10px 40px #0008;background:#000}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:460px}
.btn{flex:1 1 140px;border:0;border-radius:10px;padding:12px 14px;font:700 15px Archivo,Arial,sans-serif;cursor:pointer;color:#fff;background:var(--green)}
.btn.sec{background:#26302b}
.btn.red{background:var(--red)}
.cap{width:100%;max-width:460px}
.cap textarea{min-height:240px}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.note{font-size:12px;color:#ffd27a;margin:4px 0 6px}
</style>

<header class="top">
  <img src="logo.png" alt="">
  <h1>CDA <span>Grafik-Studio</span></h1>
  <a href="./">zur Homepage</a>
</header>

<div class="app">
  <div class="ctl">
    <div class="box">
      <h2>Was posten?</h2>
      <select id="type"></select>
      <div id="src"></div>
    </div>
    <div class="box">
      <h2>Design</h2>
      <div class="themes" id="themes"></div>
      <div class="two"><button class="btn sec" id="variant">Neue Variante</button><button class="btn red" id="surprise">Überrasch mich</button></div>
      <div class="seg" id="formats" style="margin-top:10px"></div>
      <label class="chk"><input type="checkbox" id="partners" checked> Partnerleiste anzeigen</label>
    </div>
    <div class="box">
      <h2>Texte</h2>
      <div id="fields"></div>
      <p class="hint">Alles ist vorausgefüllt und frei änderbar. Listen: eine Zeile pro Eintrag, Teile mit | trennen.</p>
    </div>
  </div>

  <div class="view">
    <div class="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>
    <div class="acts">
      <button class="btn" id="dl">Bild speichern</button>
      <button class="btn red" id="share" hidden>Teilen</button>
    </div>
    <div class="cap box">
      <h2>Bildunterschrift</h2>
      <textarea id="caption"></textarea>
      <div class="acts" style="margin-top:8px"><button class="btn sec" id="copy">Text kopieren</button></div>
      <p class="hint">Entsteht aus den Feldern, genau 5 Hashtags. Vor dem Posten gern noch anpassen.</p>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var SBU='https://qeevsqrmltewbtrnfrfm.supabase.co',SBK='sb_publishable_pwnzx63cque5lKZEVCe4mA_5SvBP8Yd';
var RED='#E30212',GREEN='#0CA12D',INK='#141615',CREAM='#f2ecdf';
var RELAUNCH='2027-01-07',POT_FEE=10,BEST_OF=10,MASTERS_PER_SEASON=16;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var DATA=null,PLAYERS={},EVENTS=[],SIGN={},DBPL={},IMG={},T=null,M=60;
var S={type:'ergebnis',theme:'blitz',format:'feed',seed:1,team:'1',pick:null,crit:'avg',partners:true,f:{},touched:false};
if(new URLSearchParams(location.search).get('t'))S.type=new URLSearchParams(location.search).get('t');

var MODE={m501:['CDA Masters','501 Double-out. Zählt für die Masters-Rangliste und die Finals.'],c501:['Competition 501','501 Double-out, der Klassiker – ohne Masters-Wertung.'],
  di301:['301 Double-In','301 Double-in / Double-out: Punkte zählen erst nach dem ersten Doppel.'],cricket:['Cricket-Nacht','Cricket: 15 bis 20 und Bull – Taktik statt Rechnen.'],
  lucky:['Lucky Doubles','Zugeloste Doppel: stark und schwach spielen zusammen.'],friend:['Bring a Friend','Mitglied und Gast spielen zusammen im Doppel.'],
  finals:['CDA-Masters-Finals','Die besten 32 der Saison spielen um den Masters-Pott.'],alt:['CDA Competition','Offene Competition – jeder kann mitspielen.']};
var MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var PARTNERS=['bbm','gronde','karella','frey','spiel77','thalhofer'];
var FH={bs:'"Big Shoulders Display"',ar:'Archivo',an:'Anton',pm:'"Permanent Marker"',rm:'"Rubik Mono One"',as:'"Alfa Slab One"',pf:'"Playfair Display"'};

// ---------- kleine Hilfen ----------
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(R,a){return a[Math.floor(R()*a.length)];}
function dmy(iso){var p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function dm(iso){var p=iso.split('-');return p[2]+'.'+p[1]+'.';}
function dow(iso){return WD[new Date(iso+'T12:00:00').getDay()];}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function plusDays(iso,n){var t=new Date(iso+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function isUs(n){return /^Clochard Darter Augsburg/.test(n||'');}
function short(n){if(isUs(n)){var r=n.replace('Clochard Darter Augsburg','').trim();return 'CDA'+(r?' '+r:'');}return n;}
function num(s){return s==null?null:+String(s).split(':')[0];}
function de(n,d){return Number(n).toFixed(d==null?2:d).replace('.',',');}
function euro(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €';}
function load(src){if(!src)return Promise.resolve(null);if(IMG[src]!==undefined)return Promise.resolve(IMG[src]);return new Promise(function(res){var i=new Image();i.onload=function(){IMG[src]=i;res(i);};i.onerror=function(){IMG[src]=null;res(null);};i.src=src;});}
function photoSrc(name){var p=PLAYERS[(name||'').replace(/ \(Gast\)$/,'')];return p&&p.photo||null;}
function lines(s){return String(s||'').split('\n').map(function(l){return l.trim();}).filter(Boolean).map(function(l){return l.split('|').map(function(x){return x.trim();});});}

// ---------- Kalender (gleiche Regeln wie Homepage und Competition-System) ----------
function cdaCalendar(year){
  var out=[],d=new Date(Date.UTC(year,0,7,12)),i=0,ms=0,lf=-99,lc=0,ll=2,alt=0;
  while(d.getUTCDay()!==4)d.setUTCDate(d.getUTCDate()+1);
  for(;d.getUTCFullYear()===year;d.setUTCDate(d.getUTCDate()+7)){
    var iso=d.toISOString().slice(0,10);if(iso.slice(5)>='12-23')continue;var m=null;
    if(i%3===1&&ms<MASTERS_PER_SEASON){m='m501';ms++;}
    if(!m){var w=i;if(i===0||w-lf>=17){m='friend';lf=w;}else if(w-lc>=7){m='cricket';lc=w;}else if(w-ll>=11){m='lucky';ll=w;}else{m=(alt++%2)?'di301':'c501';}}
    out.push({date:iso,mode:m});i++;}
  var lm=out.filter(function(e){return e.mode==='m501';}).map(function(e){return e.date;}).pop();
  if(lm&&ms>=MASTERS_PER_SEASON){out.forEach(function(e){if(e.date===plusDays(lm,7))e.note='Finals am Samstag';});out.push({date:plusDays(lm,9),mode:'finals'});out.sort(function(a,b){return a.date<b.date?-1:1;});}
  var n=0;out.forEach(function(e){if(e.mode==='m501')e.no=++n;});
  return out;
}
function upcoming(){
  var out=[],t=new Date(today()+'T12:00:00Z');while(t.getUTCDay()!==4)t.setUTCDate(t.getUTCDate()+1);
  for(;t.toISOString().slice(0,10)<RELAUNCH;t.setUTCDate(t.getUTCDate()+7)){var iso=t.toISOString().slice(0,10),md=iso.slice(5);if(md>='12-23'||md<'01-07')continue;out.push({date:iso,mode:'alt'});}
  var y=+today().slice(0,4);[y,y+1].forEach(function(yy){if(yy>=2027)cdaCalendar(yy).forEach(function(e){if(e.date>=today())out.push(e);});});
  return out.sort(function(a,b){return a.date<b.date?-1:1;});
}
function finalsDate(year){var c=cdaCalendar(year).filter(function(e){return e.mode==='finals';})[0];return c&&c.date;}

// ---------- Liga-Daten ----------
function team(){return DATA.teams[S.team];}
function matchdays(){
  var t=team();
  if(t.matchdays)return t.matchdays.map(function(m){var v=m.venue||{};return{key:'r'+m.round,label:m.round+'. Spieltag',round:m.round,date:m.date,home:m.home,venue:v.name?v.name+(v.city?', '+v.city:''):'',city:v.city||'',street:v.street?v.street+', '+v.zip+' '+v.city:'',games:m.games};});
  return(t.matches||[]).filter(function(m){return isUs(m.home)||isUs(m.away);}).map(function(m){return{key:m.date+m.home,label:dmy(m.date)+' '+short(isUs(m.home)?m.away:m.home),round:m.round,date:m.date,home:isUs(m.home),venue:m.venue||'',city:m.venue||'',street:'',games:[{time:m.time,home:m.home,away:m.away,score:m.score,date:m.date}]};});
}
function allGames(){var o=[];matchdays().forEach(function(md){md.games.forEach(function(g){o.push(Object.assign({date:md.date},g));});});return o;}
function played(md){return md.games.every(function(g){return g.score;});}
function res(g){if(!g.score)return null;var p=g.score.split(':').map(Number),us=isUs(g.home)?p[0]:p[1],th=isUs(g.home)?p[1]:p[0];return us>th?'S':us<th?'N':'U';}
function usScore(g){var p=g.score.split(':');return isUs(g.home)?p[0]+':'+p[1]:p[1]+':'+p[0];}
function opp(g){return isUs(g.home)?g.away:g.home;}
function usRow(){return(team().table||[]).filter(function(r){return r.us;})[0];}
function pts(r){return typeof r.points==='number'?r.points:num(r.points);}
function league(){return(team().league||'').replace('3K WINMAU ','');}
function ratio(s){if(!s)return -1;var p=String(s).split(':').map(Number);return p[0]+p[1]?p[0]/(p[0]+p[1])+p[0]/1000:-1;}
function seasonLabel(){return DATA.season||'';}

// ---------- Competition-Daten ----------
function seasonEvents(year,mode){return EVENTS.filter(function(e){return e.date.slice(0,4)===String(year)&&(!mode||e.mode===mode);});}
function potFor(year){return seasonEvents(year,'m501').reduce(function(a,e){return a+((e.summary.np||e.summary.n||0)*POT_FEE);},0);}
function mastersRanking(year){var R={};seasonEvents(year,'m501').forEach(function(e){(e.summary.all||[]).forEach(function(x){(x.name||'').split(' & ').forEach(function(n){var r=R[n]||(R[n]={name:n,list:[],n:0,wins:0});r.list.push(x.pts||0);r.n++;if(x.place===1)r.wins++;});});});
  return Object.keys(R).map(function(k){var r=R[k];r.pts=r.list.slice().sort(function(a,b){return b-a;}).slice(0,BEST_OF).reduce(function(a,b){return a+b;},0);return r;}).sort(function(a,b){return b.pts-a.pts||b.wins-a.wins;});}
function signupsFor(date){
  if(SIGN[date])return Promise.resolve(SIGN[date]);
  return fetch(SBU+'/rest/v1/signups?select=player_id,guest_name,created_at&event_date=eq.'+date+'&order=created_at',{headers:{apikey:SBK}}).then(function(r){return r.ok?r.json():[];})
    .then(function(L){SIGN[date]=(L||[]).map(function(x){return x.player_id?(DBPL[x.player_id]||'?'):x.guest_name+' (Gast)';});return SIGN[date];}).catch(function(){return[];});
}

// ================= Zeichnen: Grundlagen =================
function font(w,s,f){ctx.font=w+' '+s+'px '+f+',Impact,"Arial Narrow",sans-serif';}
function fitS(txt,maxW,size,w,f,min){font(w,size,f);while(ctx.measureText(txt).width>maxW&&size>(min||16)){size-=2;font(w,size,f);}return size;}
function skewText(txt,x,y,align,k){ctx.save();ctx.translate(x,y);if(k)ctx.transform(1,0,-k,1,0,0);ctx.textAlign=align||'left';ctx.fillText(txt,0,0);ctx.restore();}
function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function paraP(x,y,w,h,sk){ctx.beginPath();ctx.moveTo(x+sk,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-sk,y+h);ctx.lineTo(x,y+h);ctx.closePath();}
function roughP(x,y,w,h,j){var R=rng(Math.round(x*7+y*13+w)),pts=[],i,st=26;for(i=0;i<=w;i+=st)pts.push([x+i,y+(R()-.5)*j]);for(i=0;i<=h;i+=st)pts.push([x+w+(R()-.5)*j,y+i]);for(i=w;i>=0;i-=st)pts.push([x+i,y+h+(R()-.5)*j]);for(i=h;i>=0;i-=st)pts.push([x+(R()-.5)*j,y+i]);
  ctx.beginPath();pts.forEach(function(p,k){k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});ctx.closePath();}
function noise(R,color,n){ctx.fillStyle=color;for(var i=0;i<n;i++)ctx.fillRect(R()*cv.width,R()*cv.height,1.6,1.6);}
function halftone(cx,cy,Rad,color,gap,maxr){ctx.fillStyle=color;gap=gap||24;maxr=maxr||10;for(var y=cy-Rad;y<=cy+Rad;y+=gap)for(var x=cx-Rad;x<=cx+Rad;x+=gap){var d=Math.hypot(x-cx,y-cy);if(d>Rad)continue;var r=maxr*(1-d/Rad);if(r<.8)continue;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}}
function bolt(x,y,w,h,color,flip){var P=[[.62,0],[.12,.56],[.44,.56],[.26,1],[.9,.36],[.56,.36],[.8,0]];ctx.beginPath();P.forEach(function(p,i){var px=x+(flip?1-p[0]:p[0])*w,py=y+p[1]*h;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});ctx.closePath();ctx.fillStyle=color;ctx.fill();}
function contain(img,x,y,w,h,align){if(!img)return 0;var s=Math.min(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;ctx.drawImage(img,align==='left'?x:align==='right'?x+w-dw:x+(w-dw)/2,y+(h-dh)/2,dw,dh);return dw;}
var BOARD=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
function dartboard(cx,cy,r,rot,c){c=c||{};var dark=c.dark||'#141414',light=c.light||'#efe4c8',a1=c.a1||RED,a2=c.a2||GREEN,line=c.line;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot||0);
  ctx.beginPath();ctx.arc(0,0,r*1.18,0,7);ctx.fillStyle=c.rim||'#0d0d0d';ctx.fill();
  var seg=Math.PI*2/20;
  function ring(r0,r1,colA,colB){for(var i=0;i<20;i++){var a=-Math.PI/2-seg/2+i*seg;ctx.beginPath();ctx.arc(0,0,r1,a,a+seg);ctx.arc(0,0,r0,a+seg,a,true);ctx.closePath();ctx.fillStyle=i%2?colB:colA;ctx.fill();if(line){ctx.strokeStyle=line;ctx.lineWidth=2;ctx.stroke();}}}
  ring(r*.1,r*.95,dark,light);ring(r*.953,r,a1,a2);ring(r*.582,r*.629,a1,a2);
  ctx.beginPath();ctx.arc(0,0,r*.094,0,7);ctx.fillStyle=a2;ctx.fill();ctx.beginPath();ctx.arc(0,0,r*.037,0,7);ctx.fillStyle=a1;ctx.fill();
  if(c.nums!==false){ctx.fillStyle=c.numCol||'#f4f1ea';font(800,r*.1,FH.bs);ctx.textAlign='center';ctx.textBaseline='middle';
    for(var i=0;i<20;i++){var a=-Math.PI/2+i*seg;ctx.save();ctx.rotate(a+Math.PI/2);ctx.fillText(String(BOARD[i]),0,-r*1.09);ctx.restore();}ctx.textBaseline='alphabetic';}
  ctx.restore();}
function brush(x,y,w,h,color,seed,ang,bg){var R=rng(seed||7);ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(ang||0);x=-w/2;y=-h/2;
  ctx.beginPath();ctx.moveTo(x+R()*20,y+R()*h*.2);var i,n=14;
  for(i=1;i<=n;i++)ctx.lineTo(x+w*i/n,y+(R()-.4)*h*.16);
  for(i=0;i<5;i++)ctx.lineTo(x+w+(R()-.3)*40,y+h*(i+.5)/5+(R()-.5)*8);
  for(i=n;i>=0;i--)ctx.lineTo(x+w*i/n,y+h+(R()-.6)*h*.16);
  for(i=4;i>=0;i--)ctx.lineTo(x-(R())*36,y+h*(i+.5)/5);
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
  if(bg){ctx.strokeStyle=bg;for(i=0;i<16;i++){ctx.globalAlpha=.08+R()*.18;ctx.lineWidth=1+R()*3;var yy=y+R()*h,xs=x+w*(.1+R()*.5);ctx.beginPath();ctx.moveTo(xs,yy);ctx.lineTo(xs+w*(.15+R()*.45),yy+(R()-.5)*6);ctx.stroke();}ctx.globalAlpha=1;}
  ctx.restore();}
function ledText(txt,x,y,h,color,align,dot,maxW){ // Punktmatrix wie eine Anzeigetafel
  var o=document.createElement('canvas'),c=o.getContext('2d'),fs=h*1.3;c.font='900 '+fs+'px Archivo,Arial,sans-serif';var tw=Math.ceil(c.measureText(txt).width)+4;
  if(maxW&&tw>maxW){var k=maxW/tw;h*=k;fs=h*1.3;dot=dot?Math.max(3,dot*k):dot;c.font='900 '+fs+'px Archivo,Arial,sans-serif';tw=Math.ceil(c.measureText(txt).width)+4;y-=0;}o.width=tw;o.height=Math.ceil(h*1.1);
  c.font='900 '+fs+'px Archivo,Arial,sans-serif';c.fillStyle='#fff';c.textBaseline='alphabetic';c.fillText(txt,2,h*1.02);
  var d=c.getImageData(0,0,o.width,o.height).data,st=dot||Math.max(5,h/9),x0=align==='center'?x-tw/2:align==='right'?x-tw:x;
  ctx.save();ctx.shadowColor=color;ctx.shadowBlur=st*1.4;ctx.fillStyle=color;
  for(var yy=st/2;yy<o.height;yy+=st)for(var xx=st/2;xx<o.width;xx+=st){if(d[(Math.floor(yy)*o.width+Math.floor(xx))*4+3]>110){ctx.beginPath();ctx.arc(x0+xx,y-h+yy,st*.36,0,7);ctx.fill();}}
  ctx.restore();return tw;}
