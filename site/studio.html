<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>CDA Grafik-Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{--red:#E30212;--green:#0CA12D;--bg:#0d100e;--panel:#161a18;--line:#2a302d;--fg:#f2f2ee;--mute:#9aa39e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Archivo,Arial,sans-serif}
header.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
header.top img{height:40px}
header.top h1{font:900 26px/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
header.top h1 span{color:var(--green)}
header.top a{margin-left:auto;color:var(--mute);font-size:13px}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:820px){.app{grid-template-columns:1fr}.view{order:-1}}
.ctl{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.box h2{font:800 15px/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;background:#202623;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:600 13px Archivo,Arial,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.seg.red button[aria-pressed=true]{background:var(--red);border-color:var(--red)}
label.f{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0f1311;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px Archivo,Arial,sans-serif}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.chk input{width:auto}
.view{display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{width:100%;max-width:440px}
canvas{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 10px 40px #0008;background:#000}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:440px}
.btn{flex:1 1 140px;border:0;border-radius:10px;padding:12px 14px;font:700 15px Archivo,Arial,sans-serif;cursor:pointer;color:#fff;background:var(--green)}
.btn.sec{background:#26302b}
.btn.red{background:var(--red)}
.cap{width:100%;max-width:440px}
.cap textarea{min-height:220px}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.note{font-size:12px;color:#ffd27a;margin-top:6px}
</style>

<header class="top">
  <img src="logo.png" alt="">
  <h1>CDA <span>Grafik-Studio</span></h1>
  <a href="./">zur Homepage</a>
</header>

<div class="app">
  <div class="ctl">
    <div class="box">
      <h2>Was posten?</h2>
      <div class="seg" id="types"></div>
    </div>
    <div class="box" id="srcBox">
      <h2>Daten</h2>
      <div id="src"></div>
    </div>
    <div class="box">
      <h2>Format &amp; Design</h2>
      <div class="seg" id="formats"></div>
      <div class="seg red" id="styles" style="margin-top:8px"></div>
      <button class="btn sec" id="variant" style="width:100%;margin-top:8px">Neue Variante würfeln</button>
      <label class="chk"><input type="checkbox" id="partners" checked> Partnerleiste anzeigen</label>
    </div>
    <div class="box">
      <h2>Texte</h2>
      <div id="fields"></div>
      <p class="hint">Alles ist vorausgefüllt und frei änderbar. Die Vorschau aktualisiert sich sofort.</p>
    </div>
  </div>

  <div class="view">
    <div class="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>
    <div class="acts">
      <button class="btn" id="dl">Bild speichern</button>
      <button class="btn red" id="share" hidden>Teilen</button>
    </div>
    <div class="cap box">
      <h2>Bildunterschrift</h2>
      <textarea id="caption"></textarea>
      <div class="acts" style="margin-top:8px"><button class="btn sec" id="copy">Text kopieren</button></div>
      <p class="hint">Der Text entsteht aus den Feldern links, genau 5 Hashtags. Vor dem Posten gern noch anpassen.</p>
    </div>
  </div>
</div>

<script>
(function(){

var DATA=null,PLAYERS={},EVENTS=[],IMG={},S={type:'ergebnis',format:'feed',style:'blitz',seed:1,team:'1',pick:null,partners:true,f:{}};

// ---------- Daten aufbereiten ----------

// ---------- Felder je Typ ----------

      var no=EVENTS.filter(function(e){return e.mode===ev.mode&&e.date.slice(0,4)===ev.date.slice(0,4)&&e.date<=ev.date;}).length;
      return{kicker:(MODE[ev.mode]||'Competition')+(ev.mode==='m501'?' #'+no:'')+' · '+dmy(ev.date),title:'Sieger',p1:nm(0),p2:nm(1),p3:nm(2),
        b1:sm.avg?'Bester Average|'+sm.avg.name+' · '+de(sm.avg.v):'',b2:sm.hf?'High Finish|'+sm.hf.name+' · '+sm.hf.v:'',b3:sm.n180?'180er|'+sm.n180+'× am Abend':(sm.best?'Bestes Leg|'+sm.best.name+' · '+sm.best.v+' Darts':''),

function allPlayers(){var out=[];Object.keys(DATA.teams).forEach(function(k){(DATA.teams[k].players||[]).forEach(function(p){if(!out.some(function(o){return o.name===p.name;}))out.push({name:p.name,team:+k,avg:p.avg,single:p.single,double:p.double});});});

var LABEL={kicker:'Oben (Liga / Anlass)',kicker2:'Oben, zweite Zeile',title:'Große Überschrift',sub:'Unterzeile',table:'Tabellenzeile',date:'Datum',venue:'Spielort',street:'Adresse',note:'Hinweis',slogan:'Schlusszeile',s1:'Wert 1 (Bezeichnung|Wert)',s2:'Wert 2 (Bezeichnung|Wert)',s3:'Wert 3 (Bezeichnung|Wert)',p1:'1. Platz',p2:'2. Platz',p3:'3. Platz',b1:'Bestwert 1 (Bezeichnung|Text)',b2:'Bestwert 2 (Bezeichnung|Text)',b3:'Bestwert 3 (Bezeichnung|Text)',name:'Name',quote:'Motto / Zitat'};

// ---------- Oberfläche ----------
function seg(el,list,key,cb){el.innerHTML=list.map(function(x){return '<button type="button" data-v="'+x[0]+'" aria-pressed="'+(S[key]===x[0])+'">'+x[1]+'</button>';}).join('');
  el.onclick=function(e){var b=e.target.closest('button');if(!b)return;S[key]=b.dataset.v;el.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);});cb&&cb();};}
function setType(){S.pick=null;S.style=DEF_STYLE[S.type];seg($('styles'),STYLES,'style',draw);buildSrc();refill();}
function buildSrc(){
  var h='';

    h+='<label class="f">Mannschaft</label><select id="team">'+Object.keys(DATA.teams).map(function(k){return '<option value="'+k+'"'+(k===S.team?' selected':'')+'>'+esc(DATA.teams[k].label+' – '+DATA.teams[k].league)+'</option>';}).join('')+'</select>';

      if(S.type==='ergebnis')l=l.slice().reverse();

  } else {
    h+='<label class="f">Spieler</label><select id="pick">'+allPlayers().map(function(p){return '<option'+(p.name===S.pick?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select><p class="hint">Fotos gibt es bisher für die Spieler oben in der Liste. Der Spieler des Monats wird von euch ausgewählt.</p>';

  S.f=fieldsFor()||{};var h='';
  if(S.f._none){h='<p class="note">'+esc(S.f._none)+'</p>';}
  if(S.f._note)h+='<p class="note">'+esc(S.f._note)+'</p>';
  Object.keys(S.f).filter(function(k){return k[0]!=='_';}).forEach(function(k){h+='<label class="f" for="f_'+k+'">'+(LABEL[k]||k)+'</label><input id="f_'+k+'" data-k="'+k+'" value="'+esc(S.f[k])+'">';});

function photoOf(name){var p=PLAYERS[(name||'').split(' & ')[0]];return p&&p.photo?load(p.photo):Promise.resolve(null);}

// ---------- Zeichnen: Grundlagen ----------
var BS='"Big Shoulders Display","Arial Narrow",Impact,sans-serif',AR='Archivo,Arial,sans-serif';
function font(w,s,f){ctx.font=w+' '+s+'px '+(f||BS);}
function fit(txt,maxW,size,w,f,min){font(w,size,f);while(ctx.measureText(txt).width>maxW&&size>(min||18)){size-=2;font(w,size,f);}return size;}

function halftone(cx,cy,R,color,gap,maxr){ctx.fillStyle=color;gap=gap||24;maxr=maxr||10;for(var y=cy-R;y<=cy+R;y+=gap)for(var x=cx-R;x<=cx+R;x+=gap){var d=Math.hypot(x-cx,y-cy);if(d>R)continue;var r=maxr*(1-d/R);if(r<1)continue;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}}

    if(f.quote)L.push('','„'+f.quote+'“');L.push('','Glückwunsch!');tags=TAGS.spieler;
  }
  if(!tags){$('caption').value='';return;}
  L.push('',tags.slice(0,5).join(' '));$('caption').value=L.join('\n').replace(/\n{3,}/g,'\n\n');
}
