name: Ergebnisse aktualisieren und veröffentlichen

on:
  schedule:
    # Zeiten in UTC. Nachts einmal, dazu nach den Bezirksliga-Abenden (Mo–Do ~23:30 Uhr)
    # und am Bundesliga-Samstag nach jedem Spielblock.
    - cron: '17 3 * * *'
    - cron: '37 22 * * 1-4'
    - cron: '7 13,16,19,21 * * 6'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Abrufprogramm testen
        run: npm test

      - name: Daten von 3K und nuLiga holen
        run: npm run fetch

      - name: Neuen Stand im Repository sichern
        run: |
          if [ -n "$(git status --porcelain -- site/data.json)" ]; then
            git config user.name  "CDA Ergebnis-Bot"
            git config user.email "actions@users.noreply.github.com"
            git add site/data.json
            git commit -m "Ergebnisse aktualisiert"
            git push
          fi

      - name: Supabase wach halten (kostenlose Projekte pausieren nach 7 Tagen ohne Abruf)
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -w "Supabase: %{http_code}\n" \
            "https://qeevsqrmltewbtrnfrfm.supabase.co/rest/v1/players?select=id&limit=1" \
            -H "apikey: sb_publishable_pwnzx63cque5lKZEVCe4mA_5SvBP8Yd"

      - name: Monatswerte für den Spieler des Monats
        run: node scripts/build-month-stats.mjs

      - id: pages
        uses: actions/configure-pages@v5

      - name: Kalender-Abos erzeugen (iCal)
        run: node scripts/build-ics.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Seiten fertig machen (Gerüst, eigene Schriften, Vorschau für WhatsApp, Google)
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fehler melden
        run: |
          if [ -s .fetch-errors.txt ]; then
            echo "::error::Mindestens eine Quelle konnte nicht abgerufen werden:"
            cat .fetch-errors.txt
            exit 1
          fi
