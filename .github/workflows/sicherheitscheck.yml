name: Sicherheitscheck Datenbank
# Prüft von außen (wie ein fremder Besucher), was in Supabase lesbar/änderbar ist. Nur von Hand starten.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sicherheitscheck.mjs
