name: Grafik-Studio Vorschau

# Nur von Hand: rendert Beispielbilder aller Designs mit den echten Schriften (zur Kontrolle).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Schriften und Seiten bauen
        run: node scripts/build.mjs
      - name: Playwright
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Bilder rendern
        run: node scripts/studio-preview.mjs previews
      - name: Bilder in den Zweig studio-previews legen (wird jedes Mal überschrieben)
        run: |
          grep -c font-face site/fonts/fonts.css > previews/_fonts.txt || true
          cd previews
          git init -q -b studio-previews
          git add .
          git -c user.name="CDA Bot" -c user.email=actions@users.noreply.github.com commit -q -m "Vorschau"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" studio-previews
